name: Validate story branch
on:
  push:
    branches: [story/shiyi-family-phone]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run story:validate
      - run: npm run story:test
      - run: npm run build
